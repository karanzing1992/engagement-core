name = "mad-reel-v5-github-mcp"
main = "dist/main.mjs"
compatibility_date = "2026-11-04"
workers_dev = true

# Cloudflare is the authenticated gateway. The owner-private GitHub repository
# is the ephemeral media vault and GitHub Actions provides FFmpeg execution.
# GITHUB_TOKEN and MCP_ACCESS_TOKEN must be scoped secrets, never committed.
[vars]
GITHUB_REPO = "karanzing1992/Matrix-House"
GITHUB_WORKFLOW = "mad-v5-private-job.yml"
GITHUB_BASE_REF = "main"
