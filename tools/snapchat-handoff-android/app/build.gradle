plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moksha.snaphandoff'
    compileSdk 34

    defaultConfig {
        applicationId "com.moksha.snaphandoff"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
