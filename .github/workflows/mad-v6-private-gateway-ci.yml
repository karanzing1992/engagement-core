name: MAD V6 | Owner Private Gateway Security Tests
on:
  push:
    branches: [feature/reel-engine-v6-gemini-pro-filmcraft-20261106]
    paths:
      - services/reel-engine/v6-private-gateway/**
      - .github/workflows/mad-v6-private-gateway-ci.yml
  pull_request:
    paths:
      - services/reel-engine/v6-private-gateway/**
      - .github/workflows/mad-v6-private-gateway-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict 30-minute expiry, private repository, CORS, owner isolation and music catalog
        run: node --test services/reel-engine/v6-private-gateway/test_gateway.mjs
