name: MAD V8 Creative Intelligence isolated CI
on:
  pull_request:
    paths:
      - 'services/reel-engine/v8-creative/**'
      - 'docs/MAD_V8_CREATIVE_INTELLIGENCE_20261108.md'
      - '.github/workflows/mad-v8-creative-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/reel-engine/v8-creative/**'
      - '.github/workflows/mad-v8-creative-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v8-private-synthetic-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify FFmpeg and FFprobe
        run: ffmpeg -hide_banner -version | head -1 && ffprobe -hide_banner -version | head -1
      - name: V8 source, editor, real AV and owner consent tests (no secrets)
        env:
          PYTHONPATH: 'services/reel-engine/v8-creative:services/reel-engine/v6-kv-gateway'
          MAD_V8_OWNER_AI_ENABLED: 'false'
        run: python3 -m unittest discover -s services/reel-engine/v8-creative -p 'test_v8*.py' -v
      - name: V7 cinema backward-compatibility tests
        env:
          PYTHONPATH: 'services/reel-engine/v6-kv-gateway:services/reel-engine/v7-cinema:experiments/reel-engine-v6:experiments/reel-engine-v5'
        run: python3 -m unittest discover -s services/reel-engine/v7-cinema -p test_v7_cinema.py -v
