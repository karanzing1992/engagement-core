name: Public Media Handoff

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Publicly downloadable source MP4 URL
        required: true
        type: string
      brand:
        description: Brand namespace
        required: false
        default: moksha
        type: string

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download media
        run: curl --fail --location --retry 3 "$SOURCE_URL" -o social-master.mp4
        env:
          SOURCE_URL: ${{ inputs.source_url }}

      - name: Create ephemeral media release
        env:
          GH_TOKEN: ${{ github.token }}
          BRAND: ${{ inputs.brand }}
        run: |
          TAG="media-${BRAND}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" social-master.mp4             --repo "$GITHUB_REPOSITORY"             --title "Temporary social media handoff"             --notes "Temporary publishing asset. Safe to delete after destination verification."
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/social-master.mp4"
          echo "MEDIA_TAG=$TAG" >> "$GITHUB_ENV"
          echo "MEDIA_URL=$URL" >> "$GITHUB_ENV"
          {
            echo "## Public media handoff"
            echo
            echo "Direct URL: $URL"
            echo
            echo "Release tag: $TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify anonymous delivery
        run: |
          curl --fail --location --retry 5 --range 0-1023 "$MEDIA_URL" -o /tmp/probe.bin
          test -s /tmp/probe.bin
