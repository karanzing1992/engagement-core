name: MAD V5 | Groq-only model-list preflight (no inference)
on:
  push:
    branches:
      - feat/mad-v5-groq-only-task-router-20261104
      - main
      - test/mad-v5-reel-engine-key-20261104
    paths:
      - experiments/reel-engine-v5/v5_config.json
      - experiments/reel-engine-v5/groq_models_preflight.py
      - .github/workflows/mad-v5-groq-model-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  groq-model-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only Groq model list for this existing owner account
        env:
          GROQ_API_KEY: ${{ secrets.REEL_ENGINE_KEY }}
        run: python3 experiments/reel-engine-v5/groq_models_preflight.py
