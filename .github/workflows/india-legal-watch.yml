name: India Finance & GST — indexed source review

on:
  push:
    paths:
      - 'legal/india-finance-gst/**'
      - '.github/workflows/india-legal-watch.yml'
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: india-legal-watch-main
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build offline legal index and validate recommendation safeguards
        working-directory: legal/india-finance-gst
        run: |
          python3 legal_search.py build
          python3 -m unittest discover -s tests -v

  watch:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check selected official government source hubs
        working-directory: legal/india-finance-gst
        run: python3 monitor.py --state data/watch-state.json --write > /tmp/india-legal-changes.json
      - name: Notify about official source changes and blocked crawls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          items=json.load(open('/tmp/india-legal-changes.json'))
          changed=[x for x in items if x['event']=='changed']
          errors=[x for x in items if x['event']=='fetch_error']
          if changed:
              with open('/tmp/india-legal-changed.md','w') as f:
                  f.write('## Legal source drift detected\n\nA source changed, **not necessarily the law**. Inspect notifications, commencement, Goa SGST equivalents and tax-year applicability. No accounting rule was modified.\n\n')
                  for x in changed: f.write('- '+x['name']+': '+x['url']+'\n')
          if errors:
              with open('/tmp/india-legal-errors.md','w') as f:
                  f.write('## Official government pages could not be monitored\n\nThese sources could not be fetched by the compliant crawler. Treat the legal snapshot as incomplete; check manually or use an approved alternate official feed. Do not bypass site restrictions.\n\n')
                  for x in errors: f.write('- '+x['name']+': '+x['url']+' ('+x.get('detail','unknown')+')\n')
          PY
          if test -f /tmp/india-legal-changed.md; then
            gh issue create --title "Review official India finance/GST source changes (run $GITHUB_RUN_ID)" --body-file /tmp/india-legal-changed.md
          fi
          if test -f /tmp/india-legal-errors.md; then
            title="India finance/GST source access blocked — monitoring incomplete"
            if ! gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --title "$title" --body-file /tmp/india-legal-errors.md
            fi
          fi
      - name: Persist observed fingerprints only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal/india-finance-gst/data/watch-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(legal): update official-source fingerprints [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
