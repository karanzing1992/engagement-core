name: Deploy Engagement Core to Moksha WordPress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DFG_DEPLOY_URL: ${{ secrets.MOKSHA_DFG_ENGAGEMENT_CORE_URL }}
    steps:
      - name: Require deployment hook
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DFG_DEPLOY_URL" || { echo "MOKSHA_DFG_ENGAGEMENT_CORE_URL is not configured." >&2; exit 1; }

      - name: Trigger Deployer for Git
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error "$DFG_DEPLOY_URL")"
          echo "$response"
          echo "$response" | jq -e '.success == true'

      - name: Verify live plugin health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if response="$(curl --fail --silent --show-error https://mokshagoa.com/wp-json/engagement-core/v1/health)" \
              && echo "$response" | jq -e '.ok == true' >/dev/null; then
              echo "$response"
              exit 0
            fi
            sleep 5
          done
          echo "Live health verification failed." >&2
          exit 1
