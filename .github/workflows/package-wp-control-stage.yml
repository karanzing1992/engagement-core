name: Package WP Control staging plugin
on:
  push:
    branches:
      - build/wp-control-staycore-stage
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate WP Control PHP
        run: |
          php -l product/wordpress-control/wp-control.php
          php -l product/wordpress-control/src/class-wp-control-bridge.php
      - name: Create canonical WordPress plugin archive
        run: |
          set -euo pipefail
          mkdir -p dist/wp-control/src
          cp product/wordpress-control/wp-control.php dist/wp-control/wp-control.php
          cp product/wordpress-control/src/class-wp-control-bridge.php dist/wp-control/src/class-wp-control-bridge.php
          grep -Fq 'Plugin Name: WP Control' dist/wp-control/wp-control.php
          grep -Fq 'Version: 0.1.2' dist/wp-control/wp-control.php
          (cd dist && zip -qr wp-control-0.1.2-staycore-stage.zip wp-control)
          unzip -t dist/wp-control-0.1.2-staycore-stage.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wp-control-0.1.2-staycore-stage
          path: dist/wp-control-0.1.2-staycore-stage.zip
          if-no-files-found: error
