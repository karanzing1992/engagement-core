name: Generic SSH production source freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-ssh-production-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-runtime-check:
    name: frozen-runtime-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with pinned official action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject source drift and cross-project changes to Generic SSH runtime
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import fnmatch,json,os,subprocess,sys
          from pathlib import Path
          data=json.loads(Path('.github/generic-ssh-production-baseline.json').read_text())
          errors=[]
          for filename, expected in data['git_blob_sha1'].items():
              p=Path(filename)
              if not p.is_file():
                  errors.append('missing locked file: '+filename)
                  continue
              actual=subprocess.run(['git','hash-object',filename],
                capture_output=True,text=True,check=True).stdout.strip()
              if actual != expected:
                  errors.append('locked source changed: '+filename)
          base=os.environ.get('BASE_SHA','').strip()
          head=os.environ.get('HEAD_SHA','').strip()
          if base and len(base)==40 and set(base)!={'0'} and head:
              changes=subprocess.run(['git','diff','--name-only','--diff-filter=ACDMRT',
                base,head],capture_output=True,text=True,check=True).stdout.splitlines()
              for name in changes:
                  if (any(name.startswith(prefix) for prefix in data['protected_directory_prefixes'])
                      or fnmatch.fnmatch(name,data['protected_migration_pattern'])):
                      errors.append('review-only protected runtime path changed: '+name)
          else:
              print('No comparable base commit; immutable source hashes checked.')
          if errors:
              for e in errors:print('::error::'+e)
              print('Frozen Generic SSH production source; see issue #83.')
              sys.exit(1)
          print('PASS: current repository Generic SSH production source matches pinned baseline.')
          print('Note: this check does NOT certify deployed Edge source or enforce branch rulesets.')
          PY
