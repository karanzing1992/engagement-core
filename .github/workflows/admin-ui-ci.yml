name: Admin UI CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check admin JavaScript syntax
        run: node --check assets/admin.js
      - name: Check admin assets exist
        run: test -s assets/admin.css && test -s assets/admin.js
