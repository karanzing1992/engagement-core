name: Free Video Renderer Recovery
on:
  push:
    branches:
      - automation/free-renderer-recovery-20261010
    paths:
      - .github/workflows/free-video-renderer-recovery.yml
  pull_request:
    paths:
      - .github/workflows/free-video-renderer-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnostics
        run: |
          set -euo pipefail
          echo '## Video renderer diagnosis' >> "$GITHUB_STEP_SUMMARY"
          ffmpeg -version > ffmpeg-version.txt
          sed -n '1p' ffmpeg-version.txt | tee -a "$GITHUB_STEP_SUMMARY"
          df -h . | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p output
      - name: Render portrait video with AAC sound
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x24312c:s=540x960:r=24:d=3' \
            -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=3' \
            -vf "drawtext=text='FFmpeg OK':fontcolor=white:fontsize=40:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -t 3 -movflags +faststart output/recovery-test.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of default=noprint_wrappers=1 output/recovery-test.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
          test -s output/recovery-test.mp4
      - name: Save diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-recovery-test
          path: output/recovery-test.mp4
          retention-days: 1
