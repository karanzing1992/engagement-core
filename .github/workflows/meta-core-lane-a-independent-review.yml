# Audit branch only. No Meta/WACRM credentials, transport, production or deployment.
name: META CORE Lane A isolated independent review
on:
  push:
    branches:
      - fix/meta-core-lane-a-report-remediation-20261111
      - audit/meta-core-lane-a-resubmit-20261111
      - integration/meta-core-lane-a-source-20261111
      - fix/meta-core-lane-a-consolidated-p3-20261111
      - fix/meta-core-lane-a-two-p2-20261111
      - fix/meta-core-lane-a-flow-metrics-p2-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-tests:
    name: Node security and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/meta/whatsapp-mcp/package-lock.json
      - name: Verify source-only manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('integrations/meta/whatsapp-mcp/manifest/lane-a-whatsapp-mcp-v1.json','utf8'));
          if (!Array.isArray(a.defaultGrants)||a.defaultGrants.length||
              a.writeEnabled!==false||a.liveProviderBound!==false||a.productionEnabled!==false)
            throw Error('META CORE source fail-closed release gate failed');
          console.log('Manifest default grants: disabled');
          NODE
      - name: Install pinned deps without scripts
        working-directory: integrations/meta/whatsapp-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independent security regressions
        working-directory: integrations/meta/whatsapp-mcp
        run: node --test test/lane-a-release-review-regressions.test.mjs test/lane-a-review-array-hardening.test.mjs test/lane-a-review-proxy-hardening.test.mjs test/lane-a-external-report-hardening.test.mjs test/lane-a-consolidated-p3-negative.test.mjs test/lane-a-codex-p2-regressions.test.mjs test/lane-a-host-reads-dojo-snapshot-p2.test.mjs test/phase1e-response-contract.test.mjs
      - name: Full Node contract and negative tests
        working-directory: integrations/meta/whatsapp-mcp
        run: npm test
      - name: Production dependency audit
        working-directory: integrations/meta/whatsapp-mcp
        run: npm audit --omit=dev --audit-level=high
      - name: Record review-only status
        run: |
          echo "SOURCE_ONLY_REVIEW=true" >> "$GITHUB_STEP_SUMMARY"
          echo "NO_META_OR_WACRM_PROVIDER=true" >> "$GITHUB_STEP_SUMMARY"
  codeql-sarif:
    name: Independent JavaScript CodeQL security-extended
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scoped CodeQL security-extended
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            name: META CORE Lane A audit only
            paths:
              - integrations/meta/whatsapp-mcp
      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /meta-core-lane-a-independent-audit
          # Pinned CodeQL analyze/action.yml supports the "output" input.
          output: ${{ github.workspace }}/audit-evidence
      - name: Fail closed on findings and record number
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const sarif=JSON.parse(fs.readFileSync('audit-evidence/javascript.sarif','utf8'));
          let n=0;
          for(const run of sarif.runs||[]){
            for(const result of run.results||[]){
              n++;
              console.log('CODEQL_FINDING '+JSON.stringify({ruleId:result.ruleId,location:result.locations?.[0]?.physicalLocation?.artifactLocation?.uri||'unknown'}));
            }
          }
          console.log('CODEQL_FINDING_COUNT='+n);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'CODEQL_FINDING_COUNT='+n+'\n');
          if(n)process.exitCode=1;
          NODE
      - name: Upload temporary SARIF evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-core-lane-a-independent-sarif
          path: audit-evidence/javascript.sarif
          if-no-files-found: error
          retention-days: 3
