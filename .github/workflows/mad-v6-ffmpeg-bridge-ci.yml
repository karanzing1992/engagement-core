name: MAD V6 FFmpeg | Isolated Signed Gateway and Media QA
on:
  pull_request:
    paths:
      - 'services/reel-engine/v6-kv-gateway/**'
      - 'services/reel-engine/v7-cinema/**'
      - 'docs/MAD_REEL_ENGINE_V7_20261107.md'
      - 'experiments/reel-engine-v6/**'
      - 'services/reel-engine/backend_*.py'
      - 'services/reel-engine/backend_policy.json'
      - '.github/workflows/mad-v6-kv-filmcraft.yml'
      - '.github/workflows/mad-v6-ffmpeg-bridge-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v6-ffmpeg-private-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install first-party FFmpeg dependencies only
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -filters | grep ' drawtext '
      - name: V6 signed private KV gateway and FFmpeg-only receipt rejection tests
        run: node --test services/reel-engine/v6-kv-gateway/test_kv_gateway.mjs
      - name: V6 FFmpeg audiovisual renderer and consent-gated JPEG frame test
        run: python3 services/reel-engine/v6-kv-gateway/test_ffmpeg_v6_smoke.py
      - name: V7 cinematic finishing, audio mastering, full decode and safe creative controls
        run: python3 services/reel-engine/v7-cinema/test_v7_cinema.py
      - name: Private runner redaction and bounded diagnostic tests
        run: python3 services/reel-engine/v6-kv-gateway/test_runner_stage_diagnostics.py
      - name: Gemini / Groq reviewed EDL, audio discovery and provider fixture regression
        run: python3 -m unittest discover -s experiments/reel-engine-v6 -p 'test_*.py' -v
      - name: Strict FFmpeg-only backend policy
        run: python3 services/reel-engine/test_backend_selection.py
      - name: Do not publish or retain test media
        if: always()
        run: echo 'Only synthesized QA source in ephemeral runner; no real footage is uploaded or published.'
