# SOURCE_ONLY: independent first-party CodeQL security scan for META CORE Lane A.
# Does not access Meta, WACRM credentials, hosted MCP, customers, or paid sends.
name: META CORE Lane A CodeQL independent security acceptance
on:
  push:
    branches:
      - fix/meta-core-lane-a-release-review-20261110
      - fix/meta-core-lane-a-report-remediation-20261111
      - audit/meta-core-lane-a-resubmit-20261111
      - integration/meta-core-lane-a-source-20261111
      - fix/meta-core-lane-a-consolidated-p3-20261111
      - fix/meta-core-lane-a-two-p2-20261111
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: meta-core-lane-a-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql-lane-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout no persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL JavaScript security extended
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            name: META CORE Lane A scoped JavaScript
            paths:
              - integrations/meta/whatsapp-mcp
      - name: Analyze source and upload to GitHub Code Scanning
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /meta-core-lane-a-source-security
          # Official pinned CodeQL analyze input: output (not sarif-results).
          # All files stay inside GITHUB_WORKSPACE; fail if output is absent.
          output: ${{ github.workspace }}/security-evidence
      - name: Assess and print scoped CodeQL findings from SARIF (fail-closed)
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const source='security-evidence/javascript.sarif';
          const sarif=JSON.parse(fs.readFileSync(source,'utf8'));
          const runs=sarif.runs||[];
          let count=0;
          for(const run of runs){
            const rules=new Map((run.tool?.driver?.rules||[]).map(r=>[r.id,r]));
            for(const finding of run.results||[]){
              count++;
              const rule=rules.get(finding.ruleId);
              const severity=rule?.properties?.['security-severity']??rule?.properties?.['problem.severity']??'unclassified';
              console.log('CODEQL_FINDING '+JSON.stringify({
                ruleId:finding.ruleId,severity,
                path:finding.locations?.[0]?.physicalLocation?.artifactLocation?.uri||'unknown'
              }));
            }
          }
          console.log('CODEQL_FINDING_COUNT='+count);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'CODEQL_FINDING_COUNT='+count+'\\n');
          if(count>0)process.exitCode=1;
          NODE
      - name: Preserve short-lived SARIF for independent auditor
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-core-lane-a-codeql-sarif
          path: security-evidence/javascript.sarif
          if-no-files-found: error
          retention-days: 3
      - name: Record scope and follow-up limitation
        run: |
          echo "SOURCE_ONLY=true" >> "$GITHUB_STEP_SUMMARY"
          echo "CODEQL_SCOPED_PATH=integrations/meta/whatsapp-mcp" >> "$GITHUB_STEP_SUMMARY"
          echo "CODEQL_IS_NOT_INDEPENDENT_REVIEWER_APPROVAL=true" >> "$GITHUB_STEP_SUMMARY"
