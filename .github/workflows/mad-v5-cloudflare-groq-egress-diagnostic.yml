name: MAD V5 | One-Time Cloudflare Groq Account Egress Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mad-v5-cloudflare-groq-egress-diagnostic.yml
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
jobs:
  cloudflare-groq-credential-diagnostic:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[MAD-GROQ-TEST]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe Groq through temporary owner Cloudflare Worker (no inference/media/logged secrets)
        env:
          REEL_ENGINE_KEY: ${{ secrets.REEL_ENGINE_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.parse,urllib.request,urllib.error
          key=os.environ.get("REEL_ENGINE_KEY","")
          if not key:
              print("CF_GROQ_EGRESS_BLOCKED missing_GitHub_REEL_ENGINE_KEY")
              sys.exit(2)
          uri=os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL","")
          token=os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN","")
          if not uri.startswith("https://") or not token:
              print("CF_GROQ_EGRESS_BLOCKED GitHub_OIDC_unavailable")
              sys.exit(3)
          aud="mad-v5-cloudflare-groq-probe/v1"
          sep="&" if "?" in uri else "?"
          req=urllib.request.Request(uri+sep+"audience="+urllib.parse.quote(aud,safe=""),headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=12) as r: identity=json.load(r).get("value")
              if not isinstance(identity,str) or len(identity.split("."))!=3:raise ValueError("OIDC returned no JWT")
              endpoint="https://mad-v5-groq-egress-probe-20261104.karanbizweb360.workers.dev/probe"
              request=urllib.request.Request(endpoint,method="POST",data=b"",headers={"Authorization":"Bearer "+identity,"X-Groq-Api-Key":key,"Accept":"application/json","User-Agent":"MAD-V5-Verified-Groq-Egress/1"})
              with urllib.request.urlopen(request,timeout=30) as r: result=json.load(r)
          except urllib.error.HTTPError as e:
              print("CF_GROQ_EGRESS_TRANSPORT_ERROR",e.code)
              sys.exit(4)
          except Exception as e:
              print("CF_GROQ_EGRESS_TRANSPORT_FAILURE",type(e).__name__)
              sys.exit(5)
          code=result.get("groq_http_status")
          print("CF_GROQ_OFFICIAL_MODELS_STATUS",code)
          if code==200:
              valid=result.get("models",{})
              for model in ("openai/gpt-oss-120b","openai/gpt-oss-20b","qwen/qwen3.8-27b"):
                  print("CF_GROQ_MODEL_LISTED",model,int(valid.get(model) is True))
              if all(valid.get(model) is True for model in ("openai/gpt-oss-120b","openai/gpt-oss-20b","qwen/qwen3.8-27b")):
                  print("CF_GROQ_EGRESS_PASS model_list_only_no_inference")
                  sys.exit(0)
              print("CF_GROQ_EGRESS_BLOCKED missing_models")
              sys.exit(6)
          print("CF_GROQ_EGRESS_BLOCKED account_permission_or_network")
          sys.exit(7)
          PY
