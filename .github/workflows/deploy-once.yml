name: One-shot Engagement Core deploy trigger

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == 'deploy-engagement-core-0.9.0'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing secure WordPress deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-wordpress.yml --ref main
