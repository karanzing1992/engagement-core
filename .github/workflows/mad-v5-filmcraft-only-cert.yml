name: MAD V5 | FilmCraft-Only Manual Artistic Runtime Certification
on:
  push:
    branches: [feature/mad-v5-filmcraft-only-editor-20261105]
    paths:
      - 'services/reel-engine/filmcraft_v5_adapter.py'
      - '.github/workflows/mad-v5-filmcraft-only-cert.yml'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: mad-filmcraft-only-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  filmcraft-only:
    if: github.event_name != 'issues' || (github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[MAD-V5-FILMCRAFT-TEST] '))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Compile pure FilmCraft V5 adapter and verify no external video editor invocation
        run: |
          set -euo pipefail
          python3 -m py_compile services/reel-engine/filmcraft_v5_adapter.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('services/reel-engine/filmcraft_v5_adapter.py')
          s=p.read_text()
          tree=ast.parse(s)
          forbidden={'ffmpeg','ffprobe','avconv','moviepy'}
          assert not any(isinstance(n,ast.Constant) and isinstance(n.value,str) and n.value.strip().lower() in forbidden for n in ast.walk(tree))
          assert 'filmcraft_only' in s
          print('FILMCRAFT_ONLY_SOURCE_CONTRACT_PASS')
          PY
      - name: Install verified FilmCraft 0.16.0 headless native editor
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filmcraft"; cd "$RUNNER_TEMP/filmcraft"
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 180 -o filmcraft.tar.gz https://github.com/storytold/filmcraft/releases/download/v0.16.0/filmcraft-0.16.0-linux-x86_64.tar.gz
          echo '588390eee5d7e1634f05794c4f877ddf29494d9cf74405111d67c16cbe215ae9  filmcraft.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          with tarfile.open("filmcraft.tar.gz") as a:
              for x in a:
                  assert not (x.name.startswith('/') or '..' in x.name.split('/') or x.issym() or x.islnk() or x.isdev())
          PY
          tar -xzf filmcraft.tar.gz
          cli="$RUNNER_TEMP/filmcraft/filmcraft-0.16.0-linux-x86_64/bin/filmcraft-cli"
          test -x "$cli"
          "$cli" --version | grep -q '0.16.0'
          echo "FILMCRAFT_CLI=$cli" >> "$GITHUB_ENV"
      - name: Execute FilmCraft-only test from synthetic color source with actual grade and typography
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filmcraft-private-qa"
          cat > "$RUNNER_TEMP/filmcraft-private-qa/effects.json" <<'JSON'
          [[{"name":"color_grade","parameters":{"contrast":10}},{"name":"motion_typography","parameters":{"text":"NATURE RESETS","size":42,"seconds":1.5}}]]
          JSON
          python3 services/reel-engine/filmcraft_v5_adapter.py \
            --cli "$FILMCRAFT_CLI" \
            --workdir "$RUNNER_TEMP/filmcraft-private-qa" \
            --width 480 --height 270 --fps 24 \
            --operations-json "$RUNNER_TEMP/filmcraft-private-qa/effects.json" \
            --hook 'BEAT THE HEAT WITH NATURE'
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'filmcraft-private-qa'
          j=json.loads((d/'filmcraft-receipt.json').read_text())
          b=(d/'filmcraft-v5-private.mp4').read_bytes()
          assert j['engine']=='FilmCraft' and j['filmcraft_only'] is True
          assert j['ffmpeg_invocations']==0 and j['operations_requested']==2 and j['operations_applied']==2
          assert j['operations_unapplied']==0 and len(b)>1024 and b[4:8]==b'ftyp'
          assert hashlib.sha256(b).hexdigest()==j['sha256']
          assert all(x in j['applied_operations'] for x in ('lumetri_contrast','filmcraft_text','opening_title'))
          assert j['published'] is False
          print('MAD_V5_FILMCRAFT_ONLY_SYNTHETIC_ARTISTIC_TOOLCHAIN_PASS',j['sha256'],len(b))
          PY
      - name: Archive synthetic MP4 and FilmCraft evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad-v5-filmcraft-only-qa-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/filmcraft-private-qa/filmcraft-v5-private.mp4
            ${{ runner.temp }}/filmcraft-private-qa/filmcraft-receipt.json
            ${{ runner.temp }}/filmcraft-private-qa/filmcraft-private.fcproj
          if-no-files-found: warn
          retention-days: 7
