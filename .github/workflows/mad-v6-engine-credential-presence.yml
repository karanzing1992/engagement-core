name: MAD V6 | Engine credential presence audit
on:
  push:
    branches: [feature/reel-engine-v6-gemini-pro-filmcraft-20261106]
    paths:
      - .github/workflows/mad-v6-engine-credential-presence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-names-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REEL_ENGINE_KEY: ${{ secrets.REEL_ENGINE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MAD_GITHUB_ACTIONS_DISPATCH_TOKEN: ${{ secrets.MAD_GITHUB_ACTIONS_DISPATCH_TOKEN }}
      GEMINI_PROJECT_FREE_TIER_VERIFIED: ${{ vars.GEMINI_PROJECT_FREE_TIER_VERIFIED }}
    steps:
      - name: Examine repository Actions secret presence without reading values
        shell: bash
        run: |
          set -euo pipefail
          for key in GEMINI_API_KEY REEL_ENGINE_KEY GROQ_API_KEY MAD_GITHUB_ACTIONS_DISPATCH_TOKEN; do
            if [[ -n "${!key:-}" ]]; then
              echo "${key}=CONFIGURED"
            else
              echo "${key}=NOT_CONFIGURED_IN_THIS_REPOSITORY"
            fi
          done
          if [[ "${GEMINI_PROJECT_FREE_TIER_VERIFIED:-}" == "true" ]]; then
            echo "GEMINI_PROJECT_FREE_TIER_VERIFIED=TRUE_CONFIGURED_FLAG"
          else
            echo "GEMINI_PROJECT_FREE_TIER_VERIFIED=NOT_TRUE"
          fi
          echo "SECRET_VALUES_NOT_DISPLAYED_OR_TRANSMITTED"
