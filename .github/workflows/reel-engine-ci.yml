name: Reel Engine CI

on:
  pull_request:
    paths:
      - "services/reel-engine/**"
  push:
    branches: [main]
    paths:
      - "services/reel-engine/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reel-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pytest
      - run: pytest -q test_quality.py test_social_publishers.py
      - run: python -m py_compile app.py renderer.py captions.py audio_sync.py quality.py media_handoff.py social_publishers.py
