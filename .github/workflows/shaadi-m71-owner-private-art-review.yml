name: Shaadi M7.1 Owner-Private Gemini Art Review
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: shaadi-m71-review-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.repository == 'karanzing1992/engagement-core' &&
      github.actor == 'karanzing1992' &&
      github.event.issue.user.login == 'karanzing1992' &&
      startsWith(github.event.issue.title, '[SHAADI-M71-GEMINI] 20261111-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_PRIVATE_REVIEW_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PROJECT_FREE_TIER_VERIFIED: 'true'
      GEMINI_INFERENCE_OWNER_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned open-source image and encryption libraries
        run: python -m pip install --disable-pip-version-check cryptography==43.0.3 Pillow==11.0.0
      - name: Run trusted owner-only encrypted handoff and independent Gemini art review
        run: python services/reel-engine/game-art-review/private_runner.py
