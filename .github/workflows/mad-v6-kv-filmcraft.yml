name: MAD V6 KV FFmpeg Owner Runner
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'services/reel-engine/v6-kv-gateway/**'
      - 'services/reel-engine/v7-micro-rag/**'
      - 'experiments/reel-engine-v5/music_provider.py'
      - '.github/workflows/mad-v6-kv-filmcraft.yml'
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  v7-reviewed-music-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check V7 selector, signed music gateway and old V6 contract
        run: |
          set -euo pipefail
          python3 -m py_compile services/reel-engine/v6-kv-gateway/v7_auto_music.py services/reel-engine/v6-kv-gateway/v7_music_discovery.py services/reel-engine/v6-kv-gateway/v7_verified_source.py services/reel-engine/v6-kv-gateway/runner.py
          python3 services/reel-engine/v6-kv-gateway/test_v7_auto_music.py
          node --check services/reel-engine/v6-kv-gateway/worker.mjs
          node --test services/reel-engine/v6-kv-gateway/test_kv_gateway.mjs
  v7-txtai-official-meta-music-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned OSS txtai and verify FFmpeg
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r services/reel-engine/v7-micro-rag/requirements.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Actual txtai BM25 corpus index build reload role retrieval Meta and music
        run: python3 services/reel-engine/v7-micro-rag/test_txtai_reel_guidance.py
      - name: End-to-end synthetic music discovery to approved file FFmpeg V7 audiovisual render
        run: |
          set -euo pipefail
          python3 services/reel-engine/v6-kv-gateway/test_v7_auto_music.py
          python3 services/reel-engine/v6-kv-gateway/test_v7_music_discovery.py
          python3 services/reel-engine/v6-kv-gateway/test_v7_verified_source.py
  run-v6:
    if: github.event_name == 'workflow_dispatch' || (github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[MAD-V6-SYNTHETIC-QA] ') || (startsWith(github.event.issue.title, '[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] ') || startsWith(github.event.issue.title, '[MAD-V6-LIVE-GROQ-AUDIO-QA] ') || startsWith(github.event.issue.title, '[MAD-V8-LIVE-CREATIVE-QA] '))))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REEL_ENGINE_KEY: ${{ secrets.REEL_ENGINE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Owner checked the AI Studio project billing tier and attested FREE on 2026-11-07.
      # Scope: V7 signed private Reel Engine runner; NOT proof from model listing.
      # Rollback: change the flag below to "false" (Groq-only fallback remains).
      # Existing separate owner-approval gate and consent controls remain mandatory.
      GEMINI_PROJECT_FREE_TIER_VERIFIED: "true"
      GEMINI_FREE_TIER_OWNER_ATTESTED_ON: "2026-11-07"
      GEMINI_INFERENCE_OWNER_APPROVED: "true"
      MAD_V7_TXTAI_MICRO_RAG_ENABLED: "true"
      # Owner authorizes automatic use only after original Commons file API corroboration.
      # Any source conflict remains fail-closed. Rollback with "false".
      MAD_V7_AUTO_SOURCE_MUSIC_ENABLED: "true"
      # Explicit V8 sub-lane; ordinary untagged V7 owner jobs retain original renderer.
      MAD_V8_OWNER_AI_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned open-source txtai Reel Micro-RAG for Python 3.12
        run: python3 -m pip install --disable-pip-version-check -r services/reel-engine/v7-micro-rag/requirements.txt
      - name: Test actual packaged txtai citation-backed retrieval
        run: python3 services/reel-engine/v7-micro-rag/test_txtai_reel_guidance.py
      - name: Test isolated V6 KV gateway contract
        run: node --test services/reel-engine/v6-kv-gateway/test_kv_gateway.mjs

      # Workflow filename remains legacy for OIDC workflow_ref compatibility.
      # Filename stays unchanged because owner OIDC workflow_ref is pinned.
      - name: Install and verify FFmpeg and FFprobe (no retired editor dependencies)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep ' drawtext '
      - name: Verify FFmpeg V6 real media, consented frames and fail-closed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 services/reel-engine/v6-kv-gateway/test_ffmpeg_v6_smoke.py
          python3 services/reel-engine/v6-kv-gateway/test_runner_stage_diagnostics.py
      - name: Execute owner-authorized FFmpeg private KV render
        shell: bash
        env:
          OWNER_JOB_ID: ${{ inputs.job_id }}
          QA_ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'karanzing1992/engagement-core'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            prefix='[MAD-V6-SYNTHETIC-QA] '
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] "* ]]; then
              prefix='[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] '
            fi
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-GROQ-AUDIO-QA] "* ]]; then
              prefix='[MAD-V6-LIVE-GROQ-AUDIO-QA] '
            fi
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V8-LIVE-CREATIVE-QA] "* ]]; then
              prefix='[MAD-V8-LIVE-CREATIVE-QA] '
            fi
            [[ "$QA_ISSUE_TITLE" == "$prefix"* ]]
            OWNER_JOB_ID="${QA_ISSUE_TITLE#"$prefix"}"
          fi
          [[ "$OWNER_JOB_ID" =~ ^v6job-[a-f0-9]{32}$ ]]
          test -n "${REEL_ENGINE_KEY:-${GROQ_API_KEY:-}}"
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V8-LIVE-CREATIVE-QA] "* ]]; then
              python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID" --v8-live
            elif [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-GROQ-AUDIO-QA] "* ]]; then
              python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID" --groq-only
            elif [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] "* ]]; then
              python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID" --live-models
            else
              python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID"
            fi
          else
            python3 services/reel-engine/v6-kv-gateway/runner.py --job-id "$OWNER_JOB_ID"
          fi
      - name: No raw or finished videos enter GitHub Actions artifacts
        if: always()
        run: echo "Private footage remains in Cloudflare KV with an authenticated 30-minute deadline."
