name: MAD V6 KV GStreamer GES Owner Runner
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  run-v6:
    if: github.event_name == 'workflow_dispatch' || (github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[MAD-V6-SYNTHETIC-QA] ') || (startsWith(github.event.issue.title, '[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] ') || startsWith(github.event.issue.title, '[MAD-V6-LIVE-GROQ-AUDIO-QA] '))))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REEL_ENGINE_KEY: ${{ secrets.REEL_ENGINE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PROJECT_FREE_TIER_VERIFIED: ${{ vars.GEMINI_PROJECT_FREE_TIER_VERIFIED }}
      GEMINI_INFERENCE_OWNER_APPROVED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated V6 KV gateway contract
        run: node --test services/reel-engine/v6-kv-gateway/test_kv_gateway.mjs

      # Workflow filename remains legacy for OIDC workflow_ref compatibility.
      - name: Install native GStreamer Editing Services
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gst-plugins-base-1.0 gir1.2-ges-1.0 python3-ges-1.0 ges1.0-tools gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          /usr/bin/python3 -c "import gi; gi.require_version('GES','1.0'); from gi.repository import GES; print('GES_NATIVE_READY')"
      - name: Validate decoded video and native audio before private media claim
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 services/reel-engine/v6-kv-gateway/test_ges_v6_smoke.py
          /usr/bin/python3 services/reel-engine/v6-kv-gateway/test_runner_stage_diagnostics.py
      - name: Execute owner-authorized GStreamer GES private KV render
        shell: bash
        env:
          OWNER_JOB_ID: ${{ inputs.job_id }}
          QA_ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'karanzing1992/engagement-core'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            prefix='[MAD-V6-SYNTHETIC-QA] '
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] "* ]]; then
              prefix='[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] '
            fi
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-GROQ-AUDIO-QA] "* ]]; then
              prefix='[MAD-V6-LIVE-GROQ-AUDIO-QA] '
            fi
            [[ "$QA_ISSUE_TITLE" == "$prefix"* ]]
            OWNER_JOB_ID="${QA_ISSUE_TITLE#"$prefix"}"
          fi
          [[ "$OWNER_JOB_ID" =~ ^v6job-[a-f0-9]{32}$ ]]
          test -n "${REEL_ENGINE_KEY:-${GROQ_API_KEY:-}}"
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-GROQ-AUDIO-QA] "* ]]; then
              /usr/bin/python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID" --groq-only
            elif [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-MULTIMODAL-AUDIO-QA] "* ]]; then
              /usr/bin/python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID" --live-models
            else
              /usr/bin/python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID"
            fi
          else
            /usr/bin/python3 services/reel-engine/v6-kv-gateway/runner.py --job-id "$OWNER_JOB_ID"
          fi
      - name: No raw or finished videos enter GitHub Actions artifacts
        if: always()
        run: echo "Private footage remains in Cloudflare KV with an authenticated 30-minute deadline."
