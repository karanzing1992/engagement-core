name: MAD V6 KV FilmCraft Owner Runner
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  run-v6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated V6 KV gateway contract
        run: node --test services/reel-engine/v6-kv-gateway/test_kv_gateway.mjs

      - name: Install native FilmCraft v0.16.0, checksum-pinned
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filmcraft"
          cd "$RUNNER_TEMP/filmcraft"
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 180 \
            -o filmcraft.tar.gz 'https://github.com/storytold/filmcraft/releases/download/v0.16.0/filmcraft-0.16.0-linux-x86_64.tar.gz'
          echo '588390eee5d7e1634f05794c4f877ddf29494d9cf74405111d67c16cbe215ae9  filmcraft.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          with tarfile.open('filmcraft.tar.gz') as bundle:
            for member in bundle.getmembers():
              assert not member.name.startswith('/') and '..' not in member.name.split('/')
              assert not (member.issym() or member.islnk() or member.isdev())
          PY
          tar -xzf filmcraft.tar.gz
          cli="$RUNNER_TEMP/filmcraft/filmcraft-0.16.0-linux-x86_64/bin/filmcraft-cli"
          test -x "$cli"
          echo "FILMCRAFT_CLI=$cli" >> "$GITHUB_ENV"
