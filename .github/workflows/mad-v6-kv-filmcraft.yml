name: MAD V6 KV FilmCraft Owner Runner
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  run-v6:
    if: github.event_name == 'workflow_dispatch' || (github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[MAD-V6-SYNTHETIC-QA] ') || startsWith(github.event.issue.title, '[MAD-V6-LIVE-AUDIO-QA] ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REEL_ENGINE_KEY: ${{ secrets.REEL_ENGINE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PROJECT_FREE_TIER_VERIFIED: ${{ vars.GEMINI_PROJECT_FREE_TIER_VERIFIED }}
      GEMINI_OWNER_APPROVED_FREE_CALLS: "true"
      MAD_V6_CC0_AUDIO_ENABLED: "true"
      MAD_V6_GROQ_ONLY_WHEN_GEMINI_UNAVAILABLE: ${{ github.event_name == 'issues' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated V6 KV gateway contract
        run: node --test services/reel-engine/v6-kv-gateway/test_kv_gateway.mjs

      - name: Install native FilmCraft v0.16.0, checksum-pinned
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filmcraft"
          cd "$RUNNER_TEMP/filmcraft"
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 180 \
            -o filmcraft.tar.gz 'https://github.com/storytold/filmcraft/releases/download/v0.16.0/filmcraft-0.16.0-linux-x86_64.tar.gz'
          echo '588390eee5d7e1634f05794c4f877ddf29494d9cf74405111d67c16cbe215ae9  filmcraft.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          with tarfile.open('filmcraft.tar.gz') as bundle:
            for member in bundle.getmembers():
              assert not member.name.startswith('/') and '..' not in member.name.split('/')
              assert not (member.issym() or member.islnk() or member.isdev())
          PY
          tar -xzf filmcraft.tar.gz
          cli="$RUNNER_TEMP/filmcraft/filmcraft-0.16.0-linux-x86_64/bin/filmcraft-cli"
          test -x "$cli"
          echo "FILMCRAFT_CLI=$cli" >> "$GITHUB_ENV"

      - name: Execute owner-authorized FilmCraft-only private KV render
        shell: bash
        env:
          OWNER_JOB_ID: ${{ inputs.job_id }}
          QA_ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'karanzing1992/engagement-core'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            prefix='[MAD-V6-SYNTHETIC-QA] '
            if [[ "$QA_ISSUE_TITLE" == '[MAD-V6-LIVE-AUDIO-QA] '* ]]; then prefix='[MAD-V6-LIVE-AUDIO-QA] '; fi
            [[ "$QA_ISSUE_TITLE" == "$prefix"* ]]
            OWNER_JOB_ID="${QA_ISSUE_TITLE#"$prefix"}"
          fi
          [[ "$OWNER_JOB_ID" =~ ^v6job-[a-f0-9]{32}$ ]]
          test -n "${REEL_ENGINE_KEY:-${GROQ_API_KEY:-}}"
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            if [[ "$QA_ISSUE_TITLE" == "[MAD-V6-LIVE-AUDIO-QA] "* ]]; then
              python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID" --live-models-and-music
            else
              python3 services/reel-engine/v6-kv-gateway/synthetic_qa.py --job-id "$OWNER_JOB_ID"
            fi
          else
            python3 services/reel-engine/v6-kv-gateway/runner.py --job-id "$OWNER_JOB_ID"
          fi
      - name: No raw or finished videos enter GitHub Actions artifacts
        if: always()
        run: echo "Private footage remains in Cloudflare KV with an authenticated 30-minute deadline."
