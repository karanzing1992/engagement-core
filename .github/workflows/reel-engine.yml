name: Reel Engine Container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/reel-engine" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t "${{ steps.image.outputs.name }}:${{ github.sha }}" services/reel-engine

      - name: Push commit tag
        run: docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Tag and push latest
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "${{ steps.image.outputs.name }}:${{ github.sha }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:latest"
