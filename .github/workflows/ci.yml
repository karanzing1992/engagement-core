name: PHP checks

on:
  workflow_dispatch:
  push:
    branches:
      - fix/snapchat-video-metadata-import

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Snapchat encryption smoke test
        run: php tests/snapchat-crypto-smoke.php
      - name: Publisher API permission-scope smoke test
        run: php tests/publisher-scopes-smoke.php
      - name: Snapchat imported-video metadata smoke test
        run: php tests/snapchat-imported-video-metadata-smoke.php
