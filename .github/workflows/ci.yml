name: PHP checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/class-grec-wp-control.php'
      - 'product/gateway/supabase/functions/wpcontrol-mcp/**'
      - 'tests/native-package-sync-gateway-smoke.php'
      - 'integrations/private-auth/**'
      - 'tests/mission-control-otp-smoke.php'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: |
          if [ "${{ matrix.php }}" = "7.4" ]; then
            # Baseline repository includes PHP 8-only test harness fixtures.
            # Validate the actual WordPress PHP 7.4 plugin/runtime files.
            php -l engagement-core.php
            php -l src/class-grec-wp-control.php
            php -l tests/native-package-sync-gateway-smoke.php
            php -l integrations/private-auth/mission-control-telegram-otp.php
          else
            find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          fi
      - name: Mission Control private OTP smoke test
        run: php tests/mission-control-otp-smoke.php
      - name: Snapchat encryption smoke test
        run: php tests/snapchat-crypto-smoke.php
      - name: Publisher API permission-scope smoke test
        run: php tests/publisher-scopes-smoke.php
          php tests/native-package-sync-gateway-smoke.php
      - name: Snapchat imported-video metadata smoke test
        run: php tests/snapchat-imported-video-metadata-smoke.php
