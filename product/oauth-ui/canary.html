<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>WP Control — E2E Canary</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191919;background:#f6f5f1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(620px,100%);background:#fff;border:1px solid #ddd9cf;border-radius:20px;padding:28px;box-shadow:0 16px 45px rgba(0,0,0,.08)}
    h1{margin:0 0 8px}.muted{color:#666;line-height:1.5}button{border:0;border-radius:12px;padding:12px 16px;font:600 15px inherit;cursor:pointer;background:#191919;color:#fff}
    button:disabled{opacity:.55;cursor:wait}pre{white-space:pre-wrap;word-break:break-word;background:#f5f2ea;border-radius:12px;padding:14px;min-height:80px}.ok{color:#176b36}.bad{color:#a12622}
  </style>
</head>
<body>
<main>
  <h1>WP Control E2E Canary</h1>
  <p class="muted">Temporary internal test. Tokens and pairing secrets are never rendered or stored by this page.</p>
  <button id="start">Start secure canary</button>
  <pre id="status">Ready.</pre>
</main>
<script type="module" src="/canary.js"></script>
</body>
</html>
