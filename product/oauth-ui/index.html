<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WP Control — Connect ChatGPT</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191919;background:#f6f5f1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border:1px solid #ddd9cf;border-radius:20px;padding:28px;box-shadow:0 16px 45px rgba(0,0,0,.08)}
    h1{font-size:28px;margin:0 0 8px}.muted{color:#666;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}
    label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #cfcac0;border-radius:12px;font:inherit}
    button{border:0;border-radius:12px;padding:12px 16px;font:600 15px inherit;cursor:pointer;background:#191919;color:#fff}
    button.secondary{background:#eeeae1;color:#191919}button:disabled{opacity:.55;cursor:wait}
    #status{min-height:24px;margin:12px 0;color:#555}.scope{background:#f5f2ea;padding:12px;border-radius:12px;margin:14px 0}.hidden{display:none}
  </style>
</head>
<body>
<main class="card">
  <h1>Connect WP Control</h1>
  <p class="muted">Authorize ChatGPT to use only the WordPress sites you explicitly pair. WP Control never asks for or stores your WordPress administrator password.</p>
  <section id="login" class="hidden">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <div class="row" style="margin-top:12px"><button id="send">Email me a sign-in link</button></div>
  </section>
  <section id="consent" class="hidden">
    <p><strong id="clientName">ChatGPT</strong> wants to connect to your WP Control account.</p>
    <div class="scope">Requested access: <span id="scopeText">email</span></div>
    <div class="row"><button id="approve">Approve</button><button id="deny" class="secondary">Deny</button></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
