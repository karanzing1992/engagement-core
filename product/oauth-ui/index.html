<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WP Control — Connect ChatGPT</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191919;background:#f6f5f1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border:1px solid #ddd9cf;border-radius:20px;padding:28px;box-shadow:0 16px 45px rgba(0,0,0,.08)}
    h1{font-size:28px;margin:0 0 8px}.muted{color:#666;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}
    label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #cfcac0;border-radius:12px;font:inherit}
    button{border:0;border-radius:12px;padding:12px 16px;font:600 15px inherit;cursor:pointer;background:#191919;color:#fff}
    button.secondary{background:#eeeae1;color:#191919}button:disabled{opacity:.55;cursor:wait}
    #status{min-height:24px;margin:12px 0;color:#555}.scope{background:#f5f2ea;padding:12px;border-radius:12px;margin:14px 0}.hidden{display:none}
  </style>
</head>
<body>
<main class="card">
  <h1>Connect WP Control</h1>
  <p class="muted">Authorize ChatGPT to use only the WordPress sites you explicitly pair. WP Control never asks for or stores your WordPress administrator password.</p>
  <section id="login" class="hidden">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <div class="row" style="margin-top:12px"><button id="send">Email me a sign-in link</button></div>
  </section>
  <section id="consent" class="hidden">
    <p><strong id="clientName">ChatGPT</strong> wants to connect to your WP Control account.</p>
    <div class="scope">Requested access: <span id="scopeText">email</span></div>
    <div class="row"><button id="approve">Approve</button><button id="deny" class="secondary">Deny</button></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm";
const PROJECT_URL="https://saczglesalubroyaucqe.supabase.co";
const PUBLIC_KEY="sb_publishable_QWn0aEO4-fHulmZaUacbIQ_1ejYsDXY";
const supabase=createClient(PROJECT_URL,PUBLIC_KEY,{auth:{detectSessionInUrl:true,persistSession:true,flowType:"pkce"}});
const qs=new URLSearchParams(location.search);
let authorizationId=qs.get("authorization_id")||sessionStorage.getItem("wpcontrol_authorization_id");
if(authorizationId) sessionStorage.setItem("wpcontrol_authorization_id",authorizationId);
const login=document.querySelector("#login"),consent=document.querySelector("#consent"),status=document.querySelector("#status"),
  email=document.querySelector("#email"),send=document.querySelector("#send"),approve=document.querySelector("#approve"),deny=document.querySelector("#deny");
const say=t=>status.textContent=t||"";
async function boot(){
  if(!authorizationId){say("Missing authorization request. Start the connection from ChatGPT.");return}
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){login.classList.remove("hidden");consent.classList.add("hidden");say("Sign in to continue.");return}
  const r=await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
  if(r.error){say(r.error.message||"Could not load the authorization request.");return}
  if(r.data?.redirect_url&&!r.data?.authorization_id){location.replace(r.data.redirect_url);return}
  document.querySelector("#clientName").textContent=r.data?.client?.name||r.data?.client_name||"ChatGPT";
  document.querySelector("#scopeText").textContent=r.data?.scope||"email";
  consent.classList.remove("hidden");login.classList.add("hidden");say("Review the request, then approve or deny.");
}
send.addEventListener("click",async()=>{
  const v=email.value.trim();if(!v){say("Enter your email address.");return}
  send.disabled=true;
  const callback=PROJECT_URL+"/functions/v1/wpcontrol-auth?authorization_id="+encodeURIComponent(authorizationId);
  const r=await supabase.auth.signInWithOtp({email:v,options:{emailRedirectTo:callback}});
  send.disabled=false;say(r.error?r.error.message:"Check your email for the sign-in link, then open it in this browser.");
});
approve.addEventListener("click",async()=>{
  approve.disabled=true;const r=await supabase.auth.oauth.approveAuthorization(authorizationId);
  if(r.error){approve.disabled=false;say(r.error.message);return}
  sessionStorage.removeItem("wpcontrol_authorization_id");location.href=r.data.redirect_url;
});
deny.addEventListener("click",async()=>{
  deny.disabled=true;const r=await supabase.auth.oauth.denyAuthorization(authorizationId);
  if(r.error){deny.disabled=false;say(r.error.message);return}
  sessionStorage.removeItem("wpcontrol_authorization_id");location.href=r.data.redirect_url;
});
supabase.auth.onAuthStateChange(()=>boot());boot();
</script>
</body>
</html>
